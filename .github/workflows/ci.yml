name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancels a superseded run when a branch or PR gets pushed to again, so a stale commit's jobs don't keep burning CI minutes after a newer commit has already replaced it. Scoped away from main: cancel-in-progress only fires off main so a merge landing mid-release never kills the release/publish jobs, which run solely on a push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  determine-runner:
    uses: ./.github/workflows/determine-runner.yml

  commitlint:
    name: Commitlint
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.selected-runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      # Not wagoid/commitlint-github-action: it is a Docker container action, and the self-hosted fleet has no Docker daemon. This runs the repo's own commitlint (commitlint.config.ts) over the same ranges that action used.
      - run: pnpm install --frozen-lockfile
      - name: Lint the commits of a pull request
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Lint the commits of a push
        if: github.event_name == 'push'
        run: pnpm exec commitlint --from "$BEFORE_SHA" --to "$AFTER_SHA"
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
      # A manual dispatch has no before/after range, so only the tip commit is checked.
      - name: Lint the tip commit of a manual run
        if: github.event_name == 'workflow_dispatch'
        run: pnpm exec commitlint --last

  lint:
    name: Lint
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.selected-runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .eslintcache
          # eslint.config.ts and pnpm-lock.yaml both invalidate the cache: a rule change or a dependency bump can change lint results even for files whose own content didn't change.
          key: eslintcache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.ts') }}
          restore-keys: eslintcache-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.selected-runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec attw --pack

  mutation:
    name: Mutation
    # Manual only: run it from the Actions tab (workflow_dispatch) when a change warrants a full mutation pass. It is not a required check and does not gate a release.
    if: github.event_name == 'workflow_dispatch'
    # Deliberately not the resolved runner: a cold run mutates thousands of mutants against over a thousand tests, which on the fleet's CPU-limited pods ran the full 60 minutes without finishing, while a 2-vCPU hosted runner needs well over half an hour for the same work. Blacksmith's 4-vCPU pool is billed outside GitHub's spending limit, so it does not depend on the fleet heartbeat. Stryker sizes its worker pool from the CPU count, which is accurate on a VM and not inside a throttled pod.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Content-diff based (Stryker's IncrementalDiffer text-diffs stored vs current source, never hash/mtime/git-ref), so restoring from an unrelated prior run is always safe: a mismatch only means bigger diffs and more reruns, never a wrongly-skipped mutant. restore-keys' broad prefix is what actually matches, since the exact key (this run's own id) never hits on lookup, only on save. See https://stryker-mutator.io/docs/stryker-js/incremental/.
      - name: Restore Stryker incremental result cache
        uses: actions/cache/restore@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-
      # Stryker only diffs mutated and test files, so a change to something outside that scope (config, fixture data, a snapshot, an env var) that alters behaviour is invisible to the incremental differ and could let a mutant wrongly reuse a stale result. --force on push to main (never on a PR, so PRs keep the speed benefit) periodically re-tests everything and rebuilds the incremental file from a known-clean baseline, so that blind spot can never compound silently forever.
      - run: pnpm test:mutation${{ github.ref == 'refs/heads/main' && ' -- --force' || '' }}
      - name: Save Stryker incremental result cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}

  required-checks:
    name: Required Checks
    needs: [determine-runner, commitlint, lint, typecheck]
    # Always runs, even if a dependency failed, so it can report that failure itself rather than being skipped -- a required check that's silently absent blocks a PR indefinitely instead of failing it visibly.
    if: always()
    runs-on: ${{ fromJson(needs.determine-runner.outputs.selected-runner) }}
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi

  release:
    name: Release
    needs: [commitlint, lint, typecheck]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # Stays on a GitHub-hosted runner: npm trusted publishing (OIDC) is only supported from GitHub-hosted runners, so this job cannot move to the fleet or Blacksmith.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to push the release commit/tag and create the GitHub Release
      issues: write # to comment on released issues
      pull-requests: write # to comment on released pull requests
      id-token: write # OIDC identity for npm trusted publishing (no NPM_TOKEN)
    outputs:
      published: ${{ steps.before.outputs.version != steps.after.outputs.version }}
      version: ${{ steps.after.outputs.version }}
    steps:
      # main's own ruleset requires the "Required Checks" status and blocks direct pushes, and the default GITHUB_TOKEN has no way to bypass a repository ruleset (GitHub doesn't support naming the github-actions[bot] identity as a bypass actor at all), so semantic-release's own release-commit/tag push needs a bypass identity. A deploy key with write access, added as a DeployKey bypass actor on the ruleset, is the lightest-weight one: repo-scoped, no GitHub App installation to manage, no personal/org-admin credential involved. checkout@v7 writes the key into core.sshCommand, where later steps' git commands find it, only when persist-credentials is true (src/git-auth-helper.ts configureSsh gates the config write on settings.persistCredentials; with it false the key exists only as a step-scoped GIT_SSH_COMMAND export no later step inherits, semantic-release's push-URL resolution then finds no key for the SSH repositoryUrl, silently falls back to an https URL with GITHUB_TOKEN embedded, and the ruleset rejects that push). release.config.ts's SSH-form repositoryUrl is what selects the SSH push; persisting credentials is what arms it.
      - uses: actions/checkout@v7
        with:
          # semantic-release analyses the full commit history since the last release.
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          # true on purpose (see the comment above): false leaves semantic-release's push with no SSH key, and the ruleset rejects the GITHUB_TOKEN fallback. The persisted token extraheader is inert for this push, which goes to the SSH URL, not an https:// one.
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          # registry-url is deliberately absent -- setup-node would otherwise write an .npmrc _authToken line that wins over the OIDC token exchange, breaking trusted publishing.
      - run: pnpm install --frozen-lockfile
      - name: Read pre-release version
        id: before
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Upgrade npm for OIDC trusted publishing (needs npm CLI >=11.5.1)
        run: npm install -g npm@latest
      - name: Release
        # HUSKY=0 so the commit-msg hook never fires against the automated release commit.
        run: HUSKY=0 pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Blanked, not omitted -- an inherited NPM_TOKEN/NODE_AUTH_TOKEN would otherwise be used in preference to the OIDC exchange.
          NPM_TOKEN: ''
          NODE_AUTH_TOKEN: ''
      - name: Read post-release version
        id: after
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  publish-aliases:
    name: Publish alias (${{ matrix.name }})
    needs: release
    if: needs.release.outputs.published == 'true'
    # Stays on a GitHub-hosted runner: npm trusted publishing (OIDC) is only supported from GitHub-hosted runners, so this job cannot move to the fleet or Blacksmith.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC identity for npm trusted publishing
    strategy:
      fail-fast: false
      matrix:
        # exadev-eslint-config is the unscoped name reserved alongside the scoped @exadev/eslint-config primary -- published as an identical build under the alternate name, the same alias-publish pattern documents.js already uses for js.documents.
        include:
          - { name: exadev-eslint-config }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # the release commit semantic-release just pushed
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Rewrite package name for this alias
        run: npm pkg set name="${{ matrix.name }}"
      - run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: '' # Blanked, not omitted -- an inherited NODE_AUTH_TOKEN would otherwise be used in preference to the OIDC exchange.
